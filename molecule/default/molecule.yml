---

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: "bareosdir-${image:-debian13}${TOX_ENVNAME}"
    image: "geerlingguy/docker-${image:-debian13}-ansible:latest"
    command: "/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroupns_mode: host
    pre_build_image: true

provisioner:
  name: ansible

verifier:
  name: ansible
